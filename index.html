<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Performance</title>
<script>
  // Tema antes de pintar nada (evita el destello claro/oscuro)
  (function () {
    try {
      var t = localStorage.getItem('trading_theme');
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    } catch (e) { /* almacenamiento bloqueado: se queda en claro */ }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #F3F5F8; --panel: #FFFFFF; --panel2: #F7F9FB; --border: #E3E8EE; --border2: #CDD5DF; --grid: #EEF1F5;
    --text: #0F1B2C; --text2: #4B5B70; --muted: #5F6E82;
    --accent: #2A7CC7; --accent-text: #1F64A6; --accent-soft: rgba(42,124,199,.10); --accent-rgb: 42,124,199;
    --good: #12A37F; --good-text: #08785C; --good-rgb: 18,163,127;
    --bad: #E04A5C; --bad-text: #C0283C; --bad-rgb: 224,74,92;
    --warn: #B97F0F; --warn-text: #8A5D00; --warn-rgb: 226,162,58;
    --bar: #7C8CA3;
    --shadow: 0 1px 2px rgba(16,27,44,.04);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0A0E13; --panel: #121820; --panel2: #171F29; --border: #222C38; --border2: #2F3B4A; --grid: #1B232D;
    --text: #E6ECF3; --text2: #A9B6C6; --muted: #8392A5;
    --accent: #4BA3E3; --accent-text: #6DB5EA; --accent-soft: rgba(75,163,227,.14); --accent-rgb: 75,163,227;
    --good: #25C391; --good-text: #3DD6A6; --good-rgb: 37,195,145;
    --bad: #F25A6C; --bad-text: #FF8090; --bad-rgb: 242,90,108;
    --warn: #F0B444; --warn-text: #F4C66A; --warn-rgb: 240,180,68;
    --bar: #5E7088;
    --shadow: none;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button, input { font-family: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .c-good { color: var(--good-text); } .c-bad { color: var(--bad-text); } .c-warn { color: var(--warn-text); }
  .c-muted { color: var(--muted); } .c-text { color: var(--text); }
  .hidden { display: none !important; }
  .nw { white-space: nowrap; }

  /* ── Acceso ─────────────────────────────────────── */
  .gate { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .gate-box { width: 100%; max-width: 320px; text-align: center; }
  .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-text); }
  .gate h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 10px 0 6px; }
  .gate p { font-size: 13px; color: var(--text2); margin-bottom: 24px; }
  .field { width: 100%; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border2); background: var(--panel); color: var(--text); font-size: 14px; outline: none; }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .gate .field { text-align: center; margin-bottom: 10px; }
  .btn-primary { width: 100%; height: 44px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-primary:hover { filter: brightness(1.06); }
  .gate-err { min-height: 18px; margin-top: 10px; font-size: 12px; color: var(--bad-text); }

  /* ── Modal configuración ────────────────────────── */
  .modal { position: fixed; inset: 0; background: rgba(5,10,16,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal-box { position: relative; width: 100%; max-width: 480px; background: var(--panel); border: 1px solid var(--border2); border-radius: 14px; padding: 26px 26px 22px; }
  .modal-box h2 { font-size: 18px; font-weight: 600; margin: 8px 0 6px; }
  .modal-box p { font-size: 13px; color: var(--text2); margin-bottom: 16px; }
  .modal-row { display: flex; gap: 8px; }
  .modal-row .field { height: 40px; font-size: 12px; }
  .modal-row .btn-primary { width: auto; height: 40px; padding: 0 18px; font-size: 13px; }
  .modal-x { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .modal-x:hover { background: var(--panel2); color: var(--text); }
  .link-btn { margin-top: 12px; background: none; border: none; color: var(--accent-text); font-size: 12px; cursor: pointer; padding: 0; }
  .modal-err { font-size: 12px; color: var(--bad-text); margin-top: 8px; min-height: 16px; }

  /* ── Carga ──────────────────────────────────────── */
  .loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; background: var(--bg); z-index: 500; }
  .spinner { width: 30px; height: 30px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  .loading p { font-size: 13px; color: var(--text2); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Barra superior ─────────────────────────────── */
  .topbar { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); }
  @supports (backdrop-filter: blur(8px)) {
    .topbar { background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); }
  }
  .topbar-in { max-width: 1280px; margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand h1 { font-size: 17px; font-weight: 700; letter-spacing: -.015em; }
  .brand p { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 9px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 12.5px; font-weight: 500; cursor: pointer; }
  .btn:hover { border-color: var(--border2); }
  .btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  .btn.icon { width: 34px; padding: 0; justify-content: center; }
  .btn[disabled] { opacity: .65; cursor: default; }
  .btn.busy svg { animation: spin .8s linear infinite; }

  /* ── Contenido ──────────────────────────────────── */
  .wrap { max-width: 1280px; margin: 0 auto; padding: 22px 28px 56px; transition: opacity .2s; }
  .wrap.dim { opacity: .55; pointer-events: none; }
  .banner { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 12.5px; background: rgba(var(--bad-rgb), .10); border: 1px solid rgba(var(--bad-rgb), .28); color: var(--bad-text); }

  .kgroup { margin-bottom: 14px; }
  .kgroup-l { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 7px 2px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 13px; box-shadow: var(--shadow); min-width: 0; }
  .kpi-l { font-size: 12px; font-weight: 500; color: var(--text2); }
  .kpi-v { font-size: 25px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; margin-top: 6px; white-space: nowrap; }
  .kpi-s { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .kpi-s.c-warn { color: var(--warn-text); }

  .sec { display: flex; align-items: center; gap: 10px; margin: 32px 0 12px; }
  .sec-n { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--accent-text); background: var(--accent-soft); border-radius: 6px; padding: 3px 8px; }
  .sec-t { font-size: 16px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
  .sec-l { flex: 1; height: 1px; background: var(--border); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 12px; }
  .panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 13px 18px; border-bottom: 1px solid var(--border); }
  .panel-t { font-size: 13px; font-weight: 600; }
  .panel-n { font-size: 11.5px; color: var(--muted); text-align: right; }
  .panel-b { padding: 14px 18px; }
  .note { font-size: 11.5px; color: var(--muted); line-height: 1.55; padding: 0 18px 14px; }
  .note b { color: var(--text2); font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
  .grid2 > .panel { margin-bottom: 0; }

  .strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; padding: 14px 18px 2px; }
  .cell { background: var(--panel2); border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px; min-width: 0; }
  .cell-l { font-size: 11px; font-weight: 500; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell-v { font-size: 15.5px; font-weight: 600; margin-top: 2px; white-space: nowrap; }

  .chart { position: relative; width: 100%; }
  .chart-pad { padding: 10px 14px 6px 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 2px 18px 14px; font-size: 11.5px; color: var(--text2); }
  .legend > span { display: inline-flex; align-items: center; gap: 7px; }
  .k-line { width: 18px; height: 2px; border-radius: 2px; display: inline-block; }
  .k-dash { width: 18px; height: 0; border-top: 2px dashed; display: inline-block; }
  .k-box { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
  .tbl th { font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; text-align: right; padding: 9px 14px; background: var(--panel2); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .tbl td { padding: 9px 14px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tbl th:first-child, .tbl td:first-child, .tbl th.l, .tbl td.l { text-align: left; }
  .tbl tbody tr:last-child td { border-bottom: none; }
  .tbl tbody tr:hover td { background: var(--panel2); }
  .tbl .strong { font-weight: 600; }

  .mt th, .mt td { text-align: center; padding: 8px 10px; }
  .mt th:first-child, .mt td:first-child { position: sticky; left: 0; z-index: 1; background: var(--panel); text-align: left; padding-left: 18px; min-width: 112px; }
  .mt th:first-child { background: var(--panel2); }
  .mt tbody tr:hover td { background: inherit; }
  .mt tbody tr:hover td:first-child { background: var(--panel); }
  .mt td.tot, .mt th.tot { border-left: 1px solid var(--border); font-weight: 600; }
  .mt tr.yr th { color: var(--text); font-size: 11px; }
  .mt .cur::after { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-left: 5px; vertical-align: middle; }
  .mt td.ret { font-weight: 600; }
  .dot-cur { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: middle; }

  .hrow { display: grid; grid-template-columns: 84px minmax(0, 1fr) 46px 78px; align-items: center; gap: 12px; padding: 5px 0; }
  .hday { font-size: 12.5px; font-weight: 500; }
  .htrack { position: relative; height: 28px; border-radius: 7px; background: var(--panel2); border: 1px solid var(--border); }
  .hfill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px 4px 4px 6px; }
  .hlbl { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 11.5px; color: var(--text2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hwr { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .hpnl { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }

  .seq { display: flex; flex-wrap: wrap; gap: 4px; padding: 14px 18px; }
  .sq { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; letter-spacing: .02em; cursor: default; }
  .sq.w { background: rgba(var(--good-rgb), .14); color: var(--good-text); }
  .sq.l { background: rgba(var(--bad-rgb), .13); color: var(--bad-text); }
  .sq.b { background: rgba(var(--warn-rgb), .16); color: var(--warn-text); }

  .kvs { padding: 4px 18px 6px; }
  .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .kv:last-child { border-bottom: none; }
  .kv-l { color: var(--text2); font-size: 12.5px; }
  .kv-l small { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
  .kv-v { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .kv-v small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .kvs.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 44px; }
  .kvs.two .kv:nth-last-child(-n+2) { border-bottom: none; }

  .insight { margin: 4px 18px 14px; padding: 10px 12px; border-radius: 9px; background: var(--accent-soft); color: var(--text2); font-size: 12px; line-height: 1.55; }
  .insight b { color: var(--text); font-weight: 600; }
  .empty { padding: 18px; font-size: 12.5px; color: var(--muted); }

  details.panel > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 18px; }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .2s; }
  details.panel[open] > summary { border-bottom: 1px solid var(--border); }
  details.panel[open] > summary .chev { transform: rotate(180deg); }
  .method { padding: 6px 18px 16px; font-size: 12.5px; color: var(--text2); line-height: 1.6; }
  .method dt { font-weight: 600; color: var(--text); margin-top: 10px; }
  .method dd { margin: 2px 0 0; }
  .method h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 4px; }
  .method ul { padding-left: 18px; }
  .method li { margin: 3px 0; }

  .footer { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }

  /* ── Responsive ─────────────────────────────────── */
  @media (max-width: 1100px) {
    .strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid2 { grid-template-columns: 1fr; }
    .kvs.two { grid-template-columns: 1fr; }
    .kvs.two .kv:nth-last-child(2) { border-bottom: 1px solid var(--border); }
  }
  @media (max-width: 600px) {
    .topbar-in { padding: 10px 14px; }
    .brand h1 { font-size: 15px; }
    .brand p { font-size: 11px; }
    .actions .btn .txt { display: none; }
    .actions .btn { padding: 0; width: 34px; justify-content: center; }
    .wrap { padding: 14px 12px 40px; }
    .kpi { padding: 11px 12px; }
    .kpi-v { font-size: 20px; }
    .kpi-l { font-size: 11.5px; }
    .kpi-s { font-size: 11px; }
    .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 12px 12px 2px; }
    .strip .cell:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .hrow { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "day wr pnl" "track track track"; row-gap: 5px; column-gap: 14px; padding: 7px 0; }
    .hday { grid-area: day; } .htrack { grid-area: track; } .hwr { grid-area: wr; } .hpnl { grid-area: pnl; min-width: 72px; }
    .sq { width: 24px; height: 24px; }
    .sec { margin-top: 26px; }
    .sec-t { font-size: 14.5px; }
    .panel-h { padding: 11px 14px; }
    .panel-b, .kvs { padding-left: 14px; padding-right: 14px; }
    .note, .legend { padding-left: 14px; padding-right: 14px; }
    .tbl th, .tbl td { padding: 8px 10px; }
    .mt th:first-child, .mt td:first-child { padding-left: 14px; min-width: 96px; }
    .hlbl { font-size: 11px; }
    .insight { margin-left: 14px; margin-right: 14px; }
    .seq { padding: 12px 14px; }
  }
</style>
</head>
<body>

<!-- Acceso privado -->
<div id="gate" class="gate">
  <div class="gate-box">
    <div class="eyebrow">Trading Performance</div>
    <h1>Acceso Privado</h1>
    <p>Introduce la contraseña para continuar</p>
    <input id="pwInput" class="field" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn-primary" id="pwBtn">Entrar</button>
    <div id="pwErr" class="gate-err"></div>
  </div>
</div>

<!-- Configuración de la fuente de datos -->
<div id="setup" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
  <div class="modal-box">
    <button class="modal-x" id="setupClose" aria-label="Cerrar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="eyebrow">Configuración</div>
    <h2 id="setupTitle">Fuente de Datos</h2>
    <p>Dirección de la fuente de datos de tus operaciones. Se guarda en este navegador.</p>
    <div class="modal-row">
      <input id="csvUrl" class="field" type="text" placeholder="Dirección de la fuente de datos" spellcheck="false">
      <button class="btn-primary" id="setupSave">Guardar</button>
    </div>
    <div id="setupErr" class="modal-err"></div>
    <button class="link-btn" id="setupReset">Restaurar la fuente predeterminada</button>
  </div>
</div>

<div id="loading" class="loading hidden">
  <div class="spinner"></div>
  <p>Cargando datos…</p>
</div>

<div id="dash" class="hidden">
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <h1>Trading Performance</h1>
        <p id="topSub">&nbsp;</p>
      </div>
      <div class="actions">
        <button class="btn" id="refreshBtn" title="Actualizar datos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          <span class="txt">Actualizar</span>
        </button>
        <button class="btn icon" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema"></button>
        <button class="btn icon" id="setupBtn" title="Fuente de datos" aria-label="Fuente de datos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="wrap" id="content"></main>
</div>

<script>
'use strict';
// @@CORE-BEGIN ─────────────────────────────────────────────────────────────
// Núcleo de cálculo: funciones puras, sin DOM. Todas las métricas salen de aquí.
const CFG = Object.freeze({
  CAPITAL: 100000,        // capital de referencia (€)
  DEFAULT_RISK_PCT: 1.5,  // riesgo que se asume si la fila no indica uno válido (% del capital inicial)
  RISK_MIN: 0.1,          // rango de riesgo válido por operación, en %
  RISK_MAX: 10,
  ROLL_WIN: 10,           // ventana del win rate móvil (operaciones)
  MC_PATHS: 5000,         // simulaciones Monte Carlo
  DD_LIMIT: 0.10,         // umbral de drawdown evaluado en el Monte Carlo
  EDGE_GOOD_R: 0.2,       // esperanza (R/op) a partir de la cual el color es verde
  ANNUALIZE_MIN_DAYS: 365 // GIPS: no se anualizan periodos inferiores a un año
});
const EPS = 1e-9;
const DAY_MS = 86400000;
const DAY_NAMES = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const DAY_KEYS = { domingo: 0, lunes: 1, martes: 2, miercoles: 3, jueves: 4, viernes: 5, sabado: 6 };
const MONTHS = {
  enero: 1, febrero: 2, marzo: 3, abril: 4, mayo: 5, junio: 6, julio: 7, agosto: 8, septiembre: 9, setiembre: 9,
  octubre: 10, noviembre: 11, diciembre: 12, ene: 1, feb: 2, mar: 3, abr: 4, may: 5, jun: 6, jul: 7, ago: 8,
  sep: 9, sept: 9, oct: 10, nov: 11, dic: 12, january: 1, february: 2, march: 3, april: 4, june: 6, july: 7,
  august: 8, september: 9, october: 10, november: 11, december: 12, jan: 1, apr: 4, aug: 8, dec: 12
};

function norm(s) {
  return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

// "1.5%", "1,5", "−1", "-0,5R" → número. Vacío o texto → NaN (nunca 0 por defecto)
function parseNum(s) {
  if (s == null) return NaN;
  let t = String(s).trim().replace(/−/g, '-').replace(/%/g, '').replace(/[\s ]/g, '').replace(/[rR]$/, '');
  if (t === '') return NaN;
  if (t.includes(',') && t.includes('.')) t = t.replace(/\./g, '').replace(/,/g, '.');
  else if (t.includes(',')) t = t.replace(/,/g, '.');
  if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(t)) return NaN;
  const v = Number(t);
  return Number.isFinite(v) ? v : NaN;
}

function mkDay(y, m, d) {
  if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
  const t = Date.UTC(y, m - 1, d);
  const dt = new Date(t);
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
  return Math.round(t / DAY_MS);
}

// Fechas → número de día (UTC, sin desfases horarios). Formatos: d/m/aaaa, aaaa-mm-dd, "13 de mayo de 2026", "May 13, 2026".
// Sin "new Date(texto)": interpretaría 05/04 como 4 de mayo (formato EE. UU.).
function parseDate(raw) {
  if (raw == null) return null;
  const s = String(raw).trim();
  if (!s) return null;
  let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return mkDay(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[/.\-](\d{1,2})[/.\-](\d{4})(?:[ T,].*)?$/))) return mkDay(+m[3], +m[2], +m[1]);   // admite hora detrás
  if ((m = s.match(/^(\d{1,2})[/.\-](\d{1,2})[/.\-](\d{2})(?:[ T,].*)?$/))) return mkDay(2000 + +m[3], +m[2], +m[1]);
  const t = s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  if ((m = t.match(/^(\d{1,2})\s+(?:de\s+)?([a-z]+)\.?,?\s+(?:de\s+)?(\d{4})/)) && MONTHS[m[2]]) return mkDay(+m[3], MONTHS[m[2]], +m[1]);
  if ((m = t.match(/^([a-z]+)\.?\s+(\d{1,2}),?\s+(\d{4})/)) && MONTHS[m[1]]) return mkDay(+m[3], MONTHS[m[1]], +m[2]);
  return null;
}

const weekdayOf = day => ((day + 4) % 7 + 7) % 7;               // 0 = domingo
const monthIdx = day => { const d = new Date(day * DAY_MS); return d.getUTCFullYear() * 12 + d.getUTCMonth(); };
// Semana operativa de forex: el domingo (apertura) pertenece a la semana que empieza el lunes siguiente
const weekStart = day => { const w = weekdayOf(day); return w === 0 ? day + 1 : day - (w - 1); };

function classifyResult(s) {
  const t = norm(s);
  if (!t) return 'none';
  if (t.includes('takeprofit') || t === 'tp') return 'tp';
  if (t.includes('stoploss') || t === 'sl') return 'sl';
  if (t.includes('breakeven') || t === 'be') return 'be';
  return 'other';
}

const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// table: filas del CSV (la primera es la cabecera). today: número de día local.
function buildModel(table, today) {
  const header = (table[0] || []).map(norm);
  const col = {};
  header.forEach((k, i) => { if (k && !(k in col)) col[k] = i; });
  const get = (r, k) => (col[k] != null && col[k] < r.length && r[col[k]] != null) ? String(r[col[k]]) : '';

  // 1) Deduplicar: Make añade una fila nueva en cada edición → la última fila de cada N· es la vigente
  const byN = new Map();
  let rawCount = 0;
  for (let i = 1; i < table.length; i++) {
    const r = table[i];
    if (!r || !r.some(c => String(c == null ? '' : c).trim())) continue;
    const nraw = get(r, 'n').trim();
    if (!nraw) continue;
    rawCount++;
    const nv = parseNum(nraw);
    byN.set(Number.isNaN(nv) ? nraw : String(nv), r);
  }

  // 2) Clasificar cada operación
  const issues = { dayMismatch: [], assumed: [], noRisk: [], noDate: [], otherRes: [], inconsistent: [] };
  const trades = [], open = [];
  for (const r of byN.values()) {
    const nraw = get(r, 'n').trim();
    const n = parseNum(nraw);
    const day = parseDate(get(r, 'fecha'));
    const res = classifyResult(get(r, 'resultado'));
    const rr = parseNum(get(r, 'rrfinal'));
    // Riesgo de la operación en % del capital inicial (columna Riesgo: 1%, 1,5%, 2%, 3%...)
    let risk = parseNum(get(r, 'riesgo'));
    if (Number.isNaN(risk) || risk < CFG.RISK_MIN - EPS || risk > CFG.RISK_MAX + EPS) risk = null;
    let ent = DAY_KEYS[norm(get(r, 'diaentrada'))];
    if (ent != null && day != null && ent !== weekdayOf(day)) issues.dayMismatch.push(nraw);
    if (ent == null && day != null) ent = weekdayOf(day);
    const t = {
      n, nraw, day, risk, ent: ent == null ? null : ent,
      par: norm(get(r, 'par')).toUpperCase(),
      dir: get(r, 'direccion').trim(),
      tipo: get(r, 'tipo').trim(),
      exit: norm(get(r, 'diasalida'))
    };
    let R;
    if (res === 'none' && !Number.isNaN(rr) && Math.abs(rr) < EPS) {
      if (day == null) issues.noDate.push(nraw);      // sin resultado y RR 0: se trata como abierta (no como BE)
      open.push(t);
      continue;
    }
    if (!Number.isNaN(rr)) {
      R = rr;
      if ((res === 'tp' && rr <= 0) || (res === 'sl' && rr >= 0) || (res === 'be' && Math.abs(rr) > EPS)) issues.inconsistent.push(nraw);
    } else if (res === 'tp' || res === 'sl' || res === 'be') {
      R = res === 'tp' ? 1 : res === 'sl' ? -1 : 0;   // RR vacío: se asume el 1:1 del sistema y se avisa
      issues.assumed.push(nraw);
    } else if (res === 'other') {
      issues.otherRes.push(nraw);                     // resultado desconocido sin RR: no se puede valorar
      continue;
    } else {
      if (day == null) issues.noDate.push(nraw);
      open.push(t);
      continue;
    }
    if (day == null) issues.noDate.push(nraw);
    if (t.risk == null) { issues.noRisk.push(nraw); t.risk = CFG.DEFAULT_RISK_PCT; }   // sin riesgo válido: se asume 1,5% y se avisa
    t.R = R;
    t.pnl = R * t.risk / 100 * CFG.CAPITAL;           // beneficio = RR final × riesgo × capital inicial (sin interés compuesto)
    t.out = R > EPS ? 'w' : R < -EPS ? 'l' : 'b';
    trades.push(t);
  }

  // 3) Orden cronológico (fecha de entrada; a igual fecha, por N·)
  const sk = t => [t.day == null ? 1e9 : t.day, Number.isNaN(t.n) ? 1e18 : t.n];
  trades.sort((a, b) => { const A = sk(a), B = sk(b); return (A[0] - B[0]) || (A[1] - B[1]); });
  open.sort((a, b) => ((a.day == null ? 1e9 : a.day) - (b.day == null ? 1e9 : b.day)) || ((Number.isNaN(a.n) ? 1e18 : a.n) - (Number.isNaN(b.n) ? 1e18 : b.n)));

  const N = trades.length;
  const wins = trades.filter(t => t.out === 'w');
  const losses = trades.filter(t => t.out === 'l');
  const bes = trades.filter(t => t.out === 'b');
  const grossW = wins.reduce((s, t) => s + t.pnl, 0);
  const grossL = -losses.reduce((s, t) => s + t.pnl, 0);
  const net = trades.reduce((s, t) => s + t.pnl, 0);
  const avgWinR = mean(wins.map(t => t.R));
  const avgLossR = mean(losses.map(t => -t.R));
  const avgWinEur = mean(wins.map(t => t.pnl));
  const avgLossEur = mean(losses.map(t => -t.pnl));
  const expR = mean(trades.map(t => t.R));
  const expEur = mean(trades.map(t => t.pnl));
  const avgRisk = mean(trades.map(t => t.risk));

  // 4) Curva de capital y drawdown (sobre cierres; no incluye flotante)
  let eq = CFG.CAPITAL, peak = CFG.CAPITAL, peakIdx = -1;
  let maxDD = 0, ddPeak = CFG.CAPITAL, ddTrough = CFG.CAPITAL, ddPeakIdx = -1, ddTroughIdx = -1;
  let under = 0, run = 0, longest = 0;
  trades.forEach((t, i) => {
    eq += t.pnl;
    if (eq > peak + EPS) { peak = eq; peakIdx = i; }
    const dd = (peak - eq) / peak;
    if (dd > maxDD + EPS) { maxDD = dd; ddPeak = peak; ddTrough = eq; ddPeakIdx = peakIdx; ddTroughIdx = i; }
    if (eq < peak - EPS) { under++; run++; longest = Math.max(longest, run); } else run = 0;
    t.eq = eq; t.peak = peak; t.dd = dd;
  });

  // 5) Rachas (un BE corta ambas) y mayor pérdida acumulada en una racha perdedora
  let mw = 0, ml = 0, cw = 0, cl = 0, curLoss = 0, maxLossEur = 0;
  for (const t of trades) {
    if (t.out === 'w') { cw++; cl = 0; curLoss = 0; }
    else if (t.out === 'l') { cl++; cw = 0; curLoss += t.pnl; }
    else { cw = 0; cl = 0; curLoss = 0; }
    mw = Math.max(mw, cw); ml = Math.max(ml, cl); maxLossEur = Math.min(maxLossEur, curLoss);
  }

  // 6) Antigüedad y frecuencia (cuenta todas las entradas, abiertas incluidas)
  const allDays = trades.concat(open).map(t => t.day).filter(d => d != null);
  const startDay = allDays.length ? Math.min(...allDays) : today;
  const ageDays = Math.max(0, today - startDay);
  const totalTrades = N + open.length;
  const opsWeek = totalTrades / (Math.max(ageDays, 7) / 7);

  // 7) Meses de calendario completos (incluye meses sin operar = 0%). Rentabilidad TWR sobre el capital a inicio de mes.
  const m0 = monthIdx(startDay), m1 = monthIdx(today);
  const months = [];
  let cum = 0;
  for (let mi = m0; mi <= m1; mi++) {
    const tt = trades.filter(t => t.day != null && monthIdx(t.day) === mi);
    const pnl = tt.reduce((s, t) => s + t.pnl, 0);
    const estart = CFG.CAPITAL + cum;
    months.push({
      mi, year: Math.floor(mi / 12), month: mi % 12, n: tt.length,
      w: tt.filter(t => t.out === 'w').length, l: tt.filter(t => t.out === 'l').length, b: tt.filter(t => t.out === 'b').length,
      pnl, estart, ret: pnl / estart, expR: mean(tt.map(t => t.R)), inprog: mi === m1
    });
    cum += pnl;
  }
  const closedM = months.filter(m => !m.inprog);
  const rets = closedM.map(m => m.ret);
  let sharpe = null, sortino = null;
  if (rets.length >= 2) {
    const mu = mean(rets);
    const sd = Math.sqrt(rets.reduce((s, x) => s + (x - mu) ** 2, 0) / (rets.length - 1));   // desviación muestral (n−1)
    if (sd > EPS) sharpe = mu / sd * Math.sqrt(12);
    const tdd = Math.sqrt(rets.reduce((s, x) => s + Math.min(0, x) ** 2, 0) / rets.length); // desviación a la baja sobre TODOS los meses (MAR 0)
    if (tdd > EPS) sortino = mu / tdd * Math.sqrt(12);
  }
  let best = null, worst = null;
  for (const m of closedM) {
    if (!best || m.ret > best.ret + EPS) best = m;
    if (!worst || m.ret < worst.ret - EPS) worst = m;
  }
  const years = [];
  for (const m of months) {
    let y = years.find(o => o.year === m.year);
    if (!y) { y = { year: m.year, growth: 1, pnl: 0, n: 0, w: 0, l: 0, b: 0, R: 0 }; years.push(y); }
    y.growth *= (1 + m.ret); y.pnl += m.pnl; y.n += m.n; y.w += m.w; y.l += m.l; y.b += m.b;
  }
  years.forEach(y => {
    y.ret = y.growth - 1;
    y.expR = y.n ? trades.filter(t => t.day != null && Math.floor(monthIdx(t.day) / 12) === y.year).reduce((s, t) => s + t.R, 0) / y.n : null;
  });

  // 8) Métricas anualizadas: solo con ≥ 12 meses de historial (GIPS)
  let cagr = null, calmar = null;
  if (ageDays >= CFG.ANNUALIZE_MIN_DAYS && eq > 0) {
    cagr = Math.pow(eq / CFG.CAPITAL, 365.25 / ageDays) - 1;
    if (maxDD > EPS) calmar = cagr / maxDD;
  }

  // 9) Semanas operativas (incluye semanas sin operaciones)
  const counts = new Map();
  for (const t of trades.concat(open)) {
    if (t.day == null) continue;
    const k = weekStart(t.day);
    counts.set(k, (counts.get(k) || 0) + 1);
  }
  const weeks = [];
  for (let k = weekStart(startDay); k <= weekStart(today); k += 7) weeks.push({ ws: k, count: counts.get(k) || 0 });
  weeks.forEach((w, i) => { w.ma = i < 3 ? null : (weeks[i - 3].count + weeks[i - 2].count + weeks[i - 1].count + w.count) / 4; });

  // 10) Día de entrada
  const wdMap = new Map();
  for (const t of trades) {
    if (t.ent == null) continue;
    if (!wdMap.has(t.ent)) wdMap.set(t.ent, { d: t.ent, n: 0, w: 0, l: 0, b: 0, pnl: 0, R: 0 });
    const o = wdMap.get(t.ent);
    o.n++; o.pnl += t.pnl; o.R += t.R; o[t.out]++;
  }
  const weekdays = [...wdMap.values()].sort((a, b) => a.d - b.d).map(o => ({ ...o, wr: o.w / o.n, expR: o.R / o.n }));

  // 11) Duración (Día Entrada → Día Salida). "Semana siguiente" no tiene día exacto: se cuenta aparte.
  // Un cierre en la semana siguiente dura como mínimo 2 días naturales (viernes → domingo): nunca entra en "≤ 1 día".
  // Solo si la entrada fue en viernes podría durar exactamente 2 días (amb2) → "≤ 2 días" pasa a ser una cota inferior.
  function durStats(sub) {
    const known = [];
    let next = 0, unknown = 0, amb2 = 0;
    for (const t of sub) {
      if (t.ent == null || !t.exit) { unknown++; continue; }
      let isNext = /^(semanasiguiente|proximasemana|siguientesemana)/.test(t.exit);
      if (!isNext) {
        const s = DAY_KEYS[t.exit];
        if (s == null) { unknown++; continue; }
        const d = s - t.ent;
        if (d < 0) isNext = true; else known.push(d);
      }
      if (isNext) { next++; if (t.ent >= 5) amb2++; }
    }
    const tot = known.length + next;
    const n1 = known.filter(d => d <= 1).length, n2 = known.filter(d => d <= 2).length;
    return {
      n: sub.length, mean: mean(known), nKnown: known.length, next, unknown, tot, n2, amb2,
      d0: known.filter(d => d === 0).length, d1: known.filter(d => d === 1).length, d2p: known.filter(d => d >= 2).length,
      le1: tot ? n1 / tot : null, le2: tot ? n2 / tot : null
    };
  }
  const dur = { w: durStats(wins), l: durStats(losses) };

  // 12) Win rate móvil (ventana completa de 10)
  const W = CFG.ROLL_WIN;
  const rolling = trades.map((t, i) => i < W - 1 ? null : trades.slice(i - W + 1, i + 1).filter(x => x.out === 'w').length / W);

  // 13) Pares
  const pm = new Map();
  for (const t of trades) {
    const k = t.par || '?';
    if (!pm.has(k)) pm.set(k, { par: k, n: 0, w: 0, l: 0, b: 0, pnl: 0, gw: 0, gl: 0, R: 0 });
    const p = pm.get(k);
    p.n++; p.pnl += t.pnl; p.R += t.R; p[t.out]++;
    if (t.out === 'w') p.gw += t.pnl; else if (t.out === 'l') p.gl -= t.pnl;
  }
  const pairs = [...pm.values()].map(p => ({ ...p, wr: p.w / p.n, expR: p.R / p.n, pf: p.gl > EPS ? p.gw / p.gl : (p.gw > EPS ? Infinity : null) }))
    .sort((a, b) => (b.wr - a.wr) || (b.n - a.n) || (b.pnl - a.pnl) || (a.par < b.par ? -1 : a.par > b.par ? 1 : 0));

  // 13b) Nivel de riesgo
  const rm = new Map();
  for (const t of trades) {
    const k = Math.round(t.risk * 100) / 100;
    if (!rm.has(k)) rm.set(k, { risk: k, n: 0, w: 0, l: 0, b: 0, pnl: 0, R: 0 });
    const o = rm.get(k);
    o.n++; o.pnl += t.pnl; o.R += t.R; o[t.out]++;
  }
  const riskLevels = [...rm.values()].sort((a, b) => a.risk - b.risk).map(o => ({ ...o, wr: o.w / o.n, expR: o.R / o.n }));

  // 14) Monte Carlo: bootstrap bayesiano de tus propias operaciones (incluye la incertidumbre del win rate)
  let mc = null;
  if (N >= 10) {
    const H = Math.round(Math.min(500, Math.max(20, Math.round(opsWeek * 52))));
    const Rs = trades.map(t => t.R);
    const Ps = trades.map(t => t.pnl);               // resultados en € con el riesgo real de cada operación
    const sumR = Rs.reduce((s, x) => s + x, 0);
    const rnd = mulberry32((N * 7919 + Math.round(sumR * 100) * 104729) >>> 0);
    const c = new Float64Array(N);
    const mdds = new Float64Array(CFG.MC_PATHS);
    let hits = 0;
    for (let p = 0; p < CFG.MC_PATHS; p++) {
      let acc = 0;
      for (let j = 0; j < N; j++) { acc += -Math.log(1 - rnd()); c[j] = acc; }
      let e = eq, pk = peak, mdd = (pk - e) / pk;
      for (let h = 0; h < H; h++) {
        const u = rnd() * acc;
        let lo = 0, hi = N - 1;
        while (lo < hi) { const mid = (lo + hi) >> 1; if (c[mid] < u) lo = mid + 1; else hi = mid; }
        e += Ps[lo];
        if (e > pk) pk = e;
        const dd = (pk - e) / pk;
        if (dd > mdd) mdd = dd;
      }
      if (mdd >= CFG.DD_LIMIT - 1e-12) hits++;
      mdds[p] = mdd;
    }
    mdds.sort();
    mc = { H, prob: hits / CFG.MC_PATHS, p95: mdds[Math.ceil(0.95 * CFG.MC_PATHS) - 1], p50: mdds[Math.ceil(0.5 * CFG.MC_PATHS) - 1] };
  }

  return {
    today, startDay, ageDays, trades, open, rawCount, uniqueCount: byN.size,
    totals: {
      N, wins: wins.length, losses: losses.length, be: bes.length, totalTrades,
      wr: N ? wins.length / N : null,
      // Win rate mínimo para beneficio 0 con la ganancia y pérdida medias reales en €, en la misma base que el win rate
      // (los BE cuentan en el total): WR·G = (1 − WR − b)·P  →  WR* = (1 − b)·P / (G + P), con b = proporción de BE
      beWr: (avgWinEur != null && avgLossEur != null && avgWinEur + avgLossEur > EPS) ? (1 - bes.length / N) * avgLossEur / (avgWinEur + avgLossEur) : null,
      pf: grossL > EPS ? grossW / grossL : (grossW > EPS ? Infinity : null),
      grossW, grossL, net, netPct: net / CFG.CAPITAL, expR, expEur,
      avgWinR, avgLossR, avgWinEur, avgLossEur, avgRisk, finalEq: eq, opsWeek
    },
    risk: { maxDD, ddPeak, ddTrough, ddPeakIdx, ddTroughIdx, curDD: N ? trades[N - 1].dd : 0, peak,
            timeInDD: N ? under / N : null, longestDD: longest, maxWin: mw, maxLoss: ml, maxLossEur },
    months, years, monthly: { nClosed: closedM.length, avg: mean(rets), best, worst, sharpe, sortino },
    annual: { cagr, calmar, daysLeft: Math.max(0, CFG.ANNUALIZE_MIN_DAYS - ageDays) },
    weeks, weekdays, dur, rolling, pairs, riskLevels, mc, issues
  };
}

const CORRECT_PW = 'dcm';
const THEME_KEY = 'trading_theme';
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MES_T = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
const MINUS = '−';
const $ = id => document.getElementById(id);

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } return null; }
let currentUrl = store(CSV_KEY) || DEFAULT_URL;
let MODEL = null;
let charts = [];
let loadedAt = null;

/* ── Formato (es-ES) ── */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const grp = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
function fmtNum(v, dec = 2) {
  if (v == null || !Number.isFinite(v)) return '—';
  const s = Math.abs(v).toFixed(dec);
  const [i, f] = s.split('.');
  const neg = v < 0 && Number(s) !== 0;
  return (neg ? MINUS : '') + grp(i) + (f ? ',' + f : '');
}
function fmtSigned(v, dec = 2) {
  if (v == null || !Number.isFinite(v)) return '—';
  const s = fmtNum(Math.abs(v), dec);
  if (Number(Math.abs(v).toFixed(dec)) === 0) return s;
  return (v > 0 ? '+' : MINUS) + s;
}
const fmtPct = (frac, dec = 1, signed = true) => (frac == null || !Number.isFinite(frac)) ? '—' : (signed ? fmtSigned(frac * 100, dec) : fmtNum(frac * 100, dec)) + '%';
const fmtEur = (v, signed = false) => (v == null || !Number.isFinite(v)) ? '—' : (signed ? fmtSigned(v, 0) : fmtNum(v, 0)) + ' €';
const fmtR = (v, dec = 2) => (v == null || !Number.isFinite(v)) ? '—' : fmtSigned(v, dec) + 'R';
const fmtPF = v => v == null ? '—' : v === Infinity ? '∞' : fmtNum(v, 2);
const fmtRisk = v => (v == null || !Number.isFinite(v)) ? '—' : fmtNum(v, Math.abs(v * 10 - Math.round(v * 10)) < 1e-9 ? (Number.isInteger(v) ? 0 : 1) : 2) + '%';
function dayParts(day) { const d = new Date(day * DAY_MS); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate() }; }
const fmtDate = day => { if (day == null) return '—'; const p = dayParts(day); return String(p.d).padStart(2, '0') + '/' + String(p.m + 1).padStart(2, '0') + '/' + p.y; };
const fmtMonth = mi => MES[mi % 12] + ' ' + Math.floor(mi / 12);
const signCls = v => v == null ? 'c-muted' : v > EPS ? 'c-good' : v < -EPS ? 'c-bad' : 'c-muted';
const pfCls = v => v == null ? 'c-muted' : v >= 1.5 - EPS ? 'c-good' : v >= 1 - EPS ? 'c-warn' : 'c-bad';
const edgeCls = r => (r == null || !Number.isFinite(r)) ? 'c-muted' : r >= CFG.EDGE_GOOD_R - EPS ? 'c-good' : r >= -EPS ? 'c-warn' : 'c-bad';
const plural = (n, s, p) => n === 1 ? s : p;
function todayDay() { const n = new Date(); return mkDay(n.getFullYear(), n.getMonth() + 1, n.getDate()); }
const outLabel = o => o === 'w' ? 'TP' : o === 'l' ? 'SL' : 'BE';
const ICON_CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

/* ── Bloques de HTML ── */
function kpi(label, value, sub, cls, subCls) {
  return `<div class="kpi"><div class="kpi-l">${label}</div><div class="kpi-v ${cls || 'c-text'}">${value}</div><div class="kpi-s ${subCls || ''}">${sub}</div></div>`;
}
let secCount = 0;
function sec(_n, title) {
  const n = String(++secCount).padStart(2, '0');
  return `<div class="sec"><span class="sec-n">${n}</span><span class="sec-t">${title}</span><span class="sec-l"></span></div>`;
}
function panelHead(title, note) {
  return `<div class="panel-h"><span class="panel-t">${title}</span>${note ? `<span class="panel-n">${note}</span>` : ''}</div>`;
}

function renderKpis(M) {
  const T = M.totals, R = M.risk, Mo = M.monthly, A = M.annual;
  const shortS = Mo.nClosed < 12;
  const sampleTxt = `${Mo.nClosed} ${plural(Mo.nClosed, 'mes cerrado', 'meses cerrados')}`;
  const sharpeSub = Mo.sharpe == null ? 'Necesita 2 meses cerrados' : shortS ? `Muestra corta: ${sampleTxt}` : `${sampleTxt} · Rf 0%`;
  const sortinoSub = Mo.nClosed < 2 ? 'Necesita 2 meses cerrados' : Mo.sortino == null ? 'Sin meses negativos todavía' : shortS ? `Muestra corta: ${sampleTxt}` : `${sampleTxt} · MAR 0%`;
  const calmarSub = A.calmar == null ? (A.cagr == null ? `Disponible en ${A.daysLeft} ${plural(A.daysLeft, 'día', 'días')}` : 'Sin drawdown') : 'Rent. anualizada / Max DD';
  const beTxt = T.beWr == null ? '' : `break-even ${fmtPct(T.beWr, 0, false)}`;
  return `
  <div class="kgroup"><div class="kgroup-l">Rentabilidad</div><div class="kpis">
    ${kpi('Retorno Neto', fmtPct(T.netPct, 1), `${fmtEur(T.net, true)} sobre ${fmtEur(CFG.CAPITAL)}`, signCls(T.net))}
    ${kpi('Rent. Media Mensual', fmtPct(Mo.avg, 2), Mo.avg == null ? 'Sin meses cerrados' : `Media de ${sampleTxt}`, signCls(Mo.avg))}
    ${kpi('Mejor Mes', Mo.best ? fmtPct(Mo.best.ret, 1) : '—', Mo.best ? fmtMonth(Mo.best.mi) : 'Sin meses cerrados', Mo.best ? signCls(Mo.best.ret) : 'c-muted')}
    ${kpi('Peor Mes', Mo.worst ? fmtPct(Mo.worst.ret, 1) : '—', Mo.worst ? fmtMonth(Mo.worst.mi) : 'Sin meses cerrados', Mo.worst ? signCls(Mo.worst.ret) : 'c-muted')}
  </div></div>
  <div class="kgroup"><div class="kgroup-l">Sistema</div><div class="kpis">
    ${kpi('Win Rate', fmtPct(T.wr, 1, false), `${T.wins} TP · ${T.losses} SL${T.be ? ` · ${T.be} BE` : ''}${beTxt ? ` · <span class="nw">${beTxt}</span>` : ''}`, edgeCls(T.expR))}
    ${kpi('Profit Factor', fmtPF(T.pf), 'Beneficio bruto / pérdida bruta', pfCls(T.pf))}
    ${kpi('Esperanza por Operación', fmtEur(T.expEur, true), T.expR == null ? 'Sin operaciones cerradas' : `Beneficio medio · RR medio ${fmtR(T.expR)}`, signCls(T.expEur))}
    ${kpi('Operaciones / Semana', fmtNum(T.opsWeek, 1), `${T.totalTrades} ${plural(T.totalTrades, 'operación', 'operaciones')} en ${M.ageDays} ${plural(M.ageDays, 'día', 'días')}`, 'c-text')}
  </div></div>
  <div class="kgroup"><div class="kgroup-l">Riesgo</div><div class="kpis">
    ${kpi('Max Drawdown', R.maxDD > EPS ? fmtPct(-R.maxDD, 2) : '0,00%', R.maxDD > EPS ? `${fmtEur(R.ddPeak)} → ${fmtEur(R.ddTrough)}` : 'Sin drawdown', R.maxDD > EPS ? 'c-bad' : 'c-muted')}
    ${kpi('Sharpe (Anual.)', Mo.sharpe == null ? '—' : fmtNum(Mo.sharpe, 2), sharpeSub, Mo.sharpe == null ? 'c-muted' : 'c-text', Mo.sharpe != null && shortS ? 'c-warn' : '')}
    ${kpi('Sortino (Anual.)', Mo.sortino == null ? '—' : fmtNum(Mo.sortino, 2), sortinoSub, Mo.sortino == null ? 'c-muted' : 'c-text', Mo.sortino != null && shortS ? 'c-warn' : '')}
    ${kpi('Calmar Ratio', A.calmar == null ? '—' : fmtNum(A.calmar, 2), calmarSub, A.calmar == null ? 'c-muted' : 'c-text')}
  </div></div>`;
}

function renderEquity(M) {
  const T = M.totals, A = M.annual;
  const cells = [
    ['Capital Inicial', fmtEur(CFG.CAPITAL), 'c-text'],
    ['Capital Actual', fmtEur(T.finalEq), signCls(T.net)],
    ['Beneficio Neto', fmtEur(T.net, true), signCls(T.net)],
    ['Rendimiento', fmtPct(T.netPct, 1), signCls(T.net)],
    ['Rent. Anualizada', A.cagr == null ? '—' : fmtPct(A.cagr, 1), A.cagr == null ? 'c-muted' : signCls(A.cagr)],
    ['Edad de la Cuenta', `${M.ageDays} ${plural(M.ageDays, 'día', 'días')}`, 'c-text'],
    ['Operaciones', `${T.N} ${plural(T.N, 'cerrada', 'cerradas')}`, 'c-text']
  ].map(([l, v, c]) => `<div class="cell"><div class="cell-l">${l}</div><div class="cell-v ${c}">${v}</div></div>`).join('');
  const annualNote = A.cagr == null
    ? ` La rentabilidad anualizada aparecerá al cumplir 12 meses (faltan ${A.daysLeft} días): las rentabilidades de periodos inferiores a un año no se anualizan (norma GIPS).`
    : ' Rentabilidad anualizada geométrica (CAGR) desde la primera operación.';
  return `${sec('01', 'Evolución sobre 100.000 €')}
  <div class="panel">${panelHead('Evolución del Capital', T.avgRisk == null ? 'Sin interés compuesto' : `Riesgo medio ${fmtRisk(T.avgRisk)} por operación`)}
    <div class="strip">${cells}</div>
    ${M.trades.length ? `<div class="chart-pad"><div class="chart" style="height:300px"><canvas id="eqChart" role="img" aria-label="Evolución del capital en euros"></canvas></div></div>` : '<div class="empty">Aún no hay operaciones cerradas.</div>'}
    <div class="note">Cada operación arriesga el % indicado en su columna Riesgo sobre los ${fmtEur(CFG.CAPITAL)} iniciales, sin interés compuesto: beneficio = RR final × riesgo × ${fmtEur(CFG.CAPITAL)} (un TP de 1R al 2% suma ${fmtEur(2000, true)}; un SL de −1R al 1% resta ${fmtEur(1000)}).${annualNote}</div>
  </div>`;
}

function renderMonthly(M) {
  if (!M.months.length) return '';
  const maxAbs = Math.max(EPS, ...M.months.map(m => Math.abs(m.ret)));
  const head = y => `<tr class="yr"><th>${y.year}</th>${MES_T.map((t, i) => {
    const m = M.months.find(o => o.year === y.year && o.month === i);
    return `<th class="${m && m.inprog ? 'cur' : ''}">${t}</th>`;
  }).join('')}<th class="tot">Año</th></tr>`;
  const rowsFor = y => {
    const cellsFor = fn => MES_T.map((_, i) => {
      const m = M.months.find(o => o.year === y.year && o.month === i);
      return m ? fn(m) : '<td></td>';
    }).join('');
    const ret = cellsFor(m => {
      const a = m.n ? (0.07 + 0.2 * Math.min(1, Math.abs(m.ret) / maxAbs)).toFixed(3) : 0;
      const bg = m.ret > EPS ? `rgba(var(--good-rgb),${a})` : m.ret < -EPS ? `rgba(var(--bad-rgb),${a})` : 'transparent';
      return `<td class="ret ${signCls(m.ret)}" style="background:${bg}" title="${fmtMonth(m.mi)}: ${fmtEur(m.pnl, true)} sobre ${fmtEur(m.estart)}">${fmtPct(m.ret, 1)}</td>`;
    });
    const pnl = cellsFor(m => `<td class="${signCls(m.pnl)}">${fmtSigned(m.pnl, 0)}</td>`);
    const wr = cellsFor(m => m.n ? `<td class="${edgeCls(m.expR)}">${fmtPct(m.w / m.n, 0, false)}</td>` : '<td class="c-muted">—</td>');
    const ops = cellsFor(m => `<td class="${m.n ? 'c-text' : 'c-muted'}">${m.n}</td>`);
    return `
      <tr><td>Rentabilidad</td>${ret}<td class="tot ${signCls(y.ret)}">${fmtPct(y.ret, 1)}</td></tr>
      <tr><td>Beneficio (€)</td>${pnl}<td class="tot ${signCls(y.pnl)}">${fmtSigned(y.pnl, 0)}</td></tr>
      <tr><td>Win Rate</td>${wr}<td class="tot ${edgeCls(y.expR)}">${y.n ? fmtPct(y.w / y.n, 0, false) : '—'}</td></tr>
      <tr><td>Operaciones</td>${ops}<td class="tot">${y.n}</td></tr>`;
  };
  const body = M.years.map(y => `<thead>${head(y)}</thead><tbody>${rowsFor(y)}</tbody>`).join('');
  return `${sec('02', 'Consistencia Mensual')}
  <div class="panel">${panelHead('Rentabilidad Mensual', '<span class="dot-cur"></span>Mes en curso')}
    <div class="scroll"><table class="tbl mt">${body}</table></div>
    <div class="note" style="padding-top:12px">Rentabilidad de cada mes = beneficio del mes / capital al inicio del mes (TWR). La columna Año compone los meses; el beneficio en € sí se suma. Las operaciones se asignan al mes de su fecha de entrada.</div>
  </div>`;
}

function renderPairs(M) {
  if (!M.pairs.length) return '';
  const hasBE = M.pairs.some(p => p.b);
  const rows = M.pairs.map(p => `<tr>
      <td class="strong">${esc(p.par)}</td><td>${p.n}</td><td>${p.w}</td><td>${p.l}</td>${hasBE ? `<td>${p.b}</td>` : ''}
      <td class="strong ${edgeCls(p.expR)}">${fmtPct(p.wr, 0, false)}</td>
      <td class="${signCls(p.pnl)}">${fmtEur(p.pnl, true)}</td>
      <td class="${pfCls(p.pf)}">${fmtPF(p.pf)}</td></tr>`).join('');
  const small = M.pairs.filter(p => p.n < 10).length;
  return `${sec('03', 'Calidad del Sistema')}
  <div class="panel">${panelHead('Rendimiento por Par', 'Ordenado por win rate')}
    <div class="scroll"><table class="tbl">
      <thead><tr><th>Par</th><th>Ops</th><th>TP</th><th>SL</th>${hasBE ? '<th>BE</th>' : ''}<th>Win Rate</th><th>Beneficio</th><th>Profit Factor</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    ${small ? `<div class="note" style="padding-top:12px">${small} de ${M.pairs.length} pares tienen menos de 10 operaciones: con muestras tan pequeñas el win rate de cada par es sobre todo ruido estadístico, no una ventaja confirmada.</div>` : ''}
  </div>
  ${renderRiskLevels(M)}`;
}

function renderRiskLevels(M) {
  if (!M.riskLevels.length) return '';
  const totPnl = M.riskLevels.reduce((s, o) => s + o.pnl, 0);
  const rows = M.riskLevels.map(o => `<tr>
      <td class="strong">${fmtRisk(o.risk)}</td><td>${o.n}</td><td>${o.w}</td><td>${o.l}</td>
      <td class="strong ${edgeCls(o.expR)}">${fmtPct(o.wr, 0, false)}</td><td>${fmtR(o.expR)}</td>
      <td class="${signCls(o.pnl)}">${fmtEur(o.pnl, true)}</td>
      <td class="c-muted">${Math.abs(totPnl) > EPS ? fmtPct(o.pnl / totPnl, 0, false) : '—'}</td></tr>`).join('');
  return `<div class="panel">${panelHead('Rendimiento por Riesgo', 'Según el riesgo de cada operación')}
    <div class="scroll"><table class="tbl">
      <thead><tr><th>Riesgo</th><th>Ops</th><th>TP</th><th>SL</th><th>Win Rate</th><th>RR medio</th><th>Beneficio</th><th>% del beneficio</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="note" style="padding-top:12px">Muestra si las operaciones en las que arriesgas más rinden mejor (en RR) que el resto. El RR medio no depende del tamaño; el beneficio sí, porque el mismo RR al 3% vale el triple que al 1%.</div>
  </div>`;
}

function renderRisk(M) {
  const R = M.risk, T = M.totals;
  const kv = (l, sub, v, vsub, cls) => `<div class="kv"><span class="kv-l">${l}${sub ? `<small>${sub}</small>` : ''}</span><span class="kv-v ${cls || ''}">${v}${vsub ? `<small>${vsub}</small>` : ''}</span></div>`;
  const tr = M.trades;
  const dayAt = i => i < 0 ? 'el inicio' : fmtDate(tr[i].day);
  const ddRange = R.maxDD > EPS ? `${fmtEur(R.ddPeak)} → ${fmtEur(R.ddTrough)} · del ${dayAt(R.ddPeakIdx)} al ${dayAt(R.ddTroughIdx)}` : 'Sin caídas desde máximos';
  const mc = M.mc;
  const ddLim = fmtPct(CFG.DD_LIMIT, 0, false);
  const mcRows = mc
    ? kv(`Probabilidad de DD ≥ ${ddLim}`, `Próximas ${mc.H} operaciones (≈ 12 meses al ritmo actual) · Monte Carlo`, fmtPct(mc.prob, 1, false), '', mc.prob >= 0.2 ? 'c-bad' : mc.prob >= 0.05 ? 'c-warn' : 'c-good')
      + kv('Drawdown en escenario adverso', `Percentil 95: solo 1 de cada 20 simulaciones lo supera · próximas ${mc.H} ops`, fmtPct(-mc.p95, 1), `mediana ${fmtPct(-mc.p50, 1)}`, 'c-bad')
    : kv(`Probabilidad de DD ≥ ${ddLim}`, 'Monte Carlo: necesita al menos 10 operaciones cerradas', '—', '', 'c-muted')
      + kv('Drawdown en escenario adverso', 'Monte Carlo: necesita al menos 10 operaciones cerradas', '—', '', 'c-muted');
  const seq = tr.map(t => `<div class="sq ${t.out}" title="N·${esc(t.nraw)} · ${fmtDate(t.day)} · ${esc(t.par)} · ${fmtR(t.R, 1)} al ${fmtRisk(t.risk)} · ${fmtEur(t.pnl, true)}">${outLabel(t.out)}</div>`).join('');
  return `${sec('04', 'Gestión del Riesgo')}
  ${tr.length ? `<div class="panel">${panelHead('Drawdown', 'Caída desde el máximo previo de capital')}
    <div class="chart-pad"><div class="chart" style="height:190px"><canvas id="ddChart" role="img" aria-label="Drawdown desde máximos"></canvas></div></div>
  </div>` : ''}
  <div class="panel">${panelHead('Métricas de Riesgo', 'Medidas al cierre de cada operación')}
    <div class="kvs two">
      ${kv('Max Drawdown', ddRange, R.maxDD > EPS ? fmtPct(-R.maxDD, 2) : '0,00%', R.maxDD > EPS ? fmtEur(-(R.ddPeak - R.ddTrough)) : '', R.maxDD > EPS ? 'c-bad' : 'c-muted')}
      ${kv('Drawdown actual', 'Distancia al máximo de capital', R.curDD > EPS ? fmtPct(-R.curDD, 2) : '0,00%', R.curDD > EPS ? fmtEur(-(R.peak - T.finalEq)) : 'En máximos', R.curDD > EPS ? 'c-bad' : 'c-good')}
      ${kv('Tiempo bajo máximos', 'Operaciones cerradas por debajo del máximo previo', fmtPct(R.timeInDD, 0, false), '', 'c-text')}
      ${kv('Periodo más largo bajo máximos', 'Operaciones seguidas por debajo del máximo previo', `${R.longestDD} ${plural(R.longestDD, 'op', 'ops')}`, '', 'c-text')}
      ${kv('Racha máx. ganadora', 'Operaciones ganadoras seguidas', `${R.maxWin} TP`, '', R.maxWin ? 'c-good' : 'c-muted')}
      ${kv('Racha máx. perdedora', R.maxLossEur < -EPS ? `Mayor pérdida acumulada en una racha: ${fmtEur(R.maxLossEur, true)}` : 'Operaciones perdedoras seguidas', `${R.maxLoss} SL`, '', R.maxLoss ? 'c-bad' : 'c-muted')}
      ${mcRows}
    </div>
  </div>
  <div class="panel">${panelHead('Secuencia de Resultados', 'Orden cronológico')}
    ${seq ? `<div class="seq">${seq}</div>` : '<div class="empty">Sin operaciones cerradas.</div>'}
  </div>`;
}

function renderEfficiency(M) {
  const T = M.totals;
  const days = M.weekdays.map(d => {
    const rgb = d.expR >= CFG.EDGE_GOOD_R - EPS ? 'var(--good-rgb)' : d.expR >= -EPS ? 'var(--warn-rgb)' : 'var(--bad-rgb)';
    return `<div class="hrow">
      <span class="hday">${DAY_NAMES[d.d]}</span>
      <div class="htrack"><div class="hfill" style="width:${(d.wr * 100).toFixed(1)}%;background:rgba(${rgb},.30)"></div>
        <span class="hlbl">${d.w} TP&nbsp;&nbsp;${d.l} SL${d.b ? `&nbsp;&nbsp;${d.b} BE` : ''}&nbsp;&nbsp;${d.n} ${plural(d.n, 'op', 'ops')}</span></div>
      <span class="hwr ${edgeCls(d.expR)}">${fmtPct(d.wr, 0, false)}</span>
      <span class="hpnl ${signCls(d.pnl)}">${fmtEur(d.pnl, true)}</span>
    </div>`;
  }).join('');
  const D = M.dur;
  const cellOf = (s, k) => s.tot ? `${s[k]} <span class="c-muted">(${fmtPct(s[k] / s.tot, 0, false)})</span>` : '—';
  const drow = (label, k) => `<tr><td>${label}</td><td>${cellOf(D.w, k)}</td><td>${cellOf(D.l, k)}</td></tr>`;
  const meanOf = s => s.mean == null ? '—' : `${fmtNum(s.mean, 1)} ${s.mean === 1 ? 'día' : 'días'}`;
  // Comparación robusta: % cerrado en ≤ 1 día (un cierre "semana siguiente" siempre supera ese plazo)
  let insight = '';
  if (D.w.le1 != null && D.l.le1 != null) {
    insight = `<div class="insight">En 1 día o menos se cerró el <b>${fmtPct(D.l.le1, 0, false)}</b> de los SL y el <b>${fmtPct(D.w.le1, 0, false)}</b> de los TP. `
      + `${D.w.amb2 ? 'Al menos ' : ''}<b>${D.w.n2} de ${D.w.tot}</b> TP se cerraron en 2 días o menos.</div>`;
  }
  const unknownN = D.w.unknown + D.l.unknown;
  return `${sec('05', 'Eficiencia Operativa')}
  <div class="panel">${panelHead('Frecuencia de Operaciones', `Media: ${fmtNum(T.opsWeek, 1)} por semana`)}
    <div class="chart-pad"><div class="chart" style="height:200px"><canvas id="freqChart" role="img" aria-label="Operaciones por semana"></canvas></div></div>
    <div class="legend">
      <span><i class="k-box" style="background:var(--bar)"></i>Entradas por semana</span>
      <span><i class="k-line" style="background:var(--accent)"></i>Media móvil 4 semanas</span>
      <span><i class="k-dash" style="border-color:var(--text2)"></i>Media de todo el periodo</span>
    </div>
  </div>
  <div class="grid2">
    <div class="panel">${panelHead('Mapa de Calor — Día de Entrada', 'Win rate y beneficio')}
      <div class="panel-b">${days || '<div class="empty">Sin datos.</div>'}</div>
    </div>
    <div class="panel">${panelHead('Duración por Resultado', 'De la entrada al cierre')}
      <div class="scroll"><table class="tbl">
        <thead><tr><th>Cierre</th><th>Take Profit</th><th>Stop Loss</th></tr></thead>
        <tbody>${drow('Mismo día', 'd0')}${drow('Al día siguiente', 'd1')}${drow('2 o más días', 'd2p')}${drow('Semana siguiente', 'next')}
          <tr><td class="strong">Media (misma semana)</td><td class="strong">${meanOf(D.w)}</td><td class="strong">${meanOf(D.l)}</td></tr></tbody></table></div>
      ${insight}
      <div class="note">Días naturales entre el día de entrada y el de salida. La media solo usa cierres dentro de la misma semana: los de "Semana siguiente" no registran el día exacto y se cuentan aparte.${unknownN ? ` ${unknownN} ${plural(unknownN, 'operación', 'operaciones')} sin día de salida válido.` : ''}</div>
    </div>
  </div>`;
}

function renderCurrent(M) {
  const T = M.totals;
  const last = M.rolling.length ? M.rolling[M.rolling.length - 1] : null;
  const lastExp = last == null ? null : mean(M.trades.slice(-CFG.ROLL_WIN).map(t => t.R));
  const openRows = M.open.slice().reverse().map(t => `<tr><td class="strong">N·${esc(t.nraw)}</td><td class="l">${esc(t.par)}</td><td class="l">${esc(t.dir) || '—'}</td><td class="l">${fmtDate(t.day)}</td><td>${t.day == null ? '—' : `${M.today - t.day} ${plural(M.today - t.day, 'día', 'días')}`}</td><td>${fmtRisk(t.risk)}</td><td class="l">${esc(t.tipo) || '—'}</td></tr>`).join('');
  return `${sec('06', 'Estado Actual')}
  <div class="panel">${panelHead('Win Rate Móvil', `Ventana de ${CFG.ROLL_WIN} operaciones`)}
    ${last == null ? `<div class="empty">Necesita al menos ${CFG.ROLL_WIN} operaciones cerradas.</div>` : `
    <div class="chart-pad"><div class="chart" style="height:200px"><canvas id="rollChart" role="img" aria-label="Win rate móvil"></canvas></div></div>
    <div class="legend">
      <span><i class="k-line" style="background:var(--accent)"></i>Últimas ${CFG.ROLL_WIN}:&nbsp;<b class="${edgeCls(lastExp)}">${fmtPct(last, 0, false)}</b>&nbsp;<span class="c-muted">(${fmtR(lastExp)} por operación)</span></span>
      <span><i class="k-dash" style="border-color:var(--text2)"></i>Global: ${fmtPct(T.wr, 1, false)}</span>
      ${T.beWr != null ? `<span><i class="k-dash" style="border-color:var(--bad)"></i>Break-even: ${fmtPct(T.beWr, 0, false)}</span>` : ''}
    </div>
    ${T.beWr != null ? `<div class="note">Break-even: win rate mínimo para no perder dinero con tu ganancia y pérdida medias actuales (${fmtEur(T.avgWinEur, true)} / ${fmtEur(-T.avgLossEur, true)} por operación). Mantenerse por debajo de esa línea con el mismo ratio significa perder dinero.</div>` : ''}`}
  </div>
  <div class="panel">${panelHead('Operaciones Abiertas', `${M.open.length} ${plural(M.open.length, 'abierta', 'abiertas')}`)}
    ${M.open.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>N·</th><th class="l">Par</th><th class="l">Dirección</th><th class="l">Entrada</th><th>Abierta</th><th>Riesgo</th><th class="l">Tipo</th></tr></thead><tbody>${openRows}</tbody></table></div>` : '<div class="empty">Sin operaciones abiertas.</div>'}

}

function renderLog(M) {

    <td class="l strong ${t.out === 'w' ? 'c-good' : t.out === 'l' ? 'c-bad' : 'c-warn'}">${outLabel(t.out)}</td><td>${fmtRisk(t.risk)}</td><td>${fmtR(t.R, 1)}</td><td class="${signCls(t.pnl)}">${fmtEur(t.pnl, true)}</td><td>${fmtEur(t.eq)}</td>
    <td class="l">${esc(t.dir) || '—'}</td><td class="l">${esc(t.tipo) || '—'}</td></tr>`).join('');

    <div class="scroll"><table class="tbl"><thead><tr><th>N·</th><th class="l">Fecha</th><th class="l">Par</th><th class="l">Resultado</th><th>Riesgo</th><th>R</th><th>Beneficio</th><th>Capital</th><th class="l">Dirección</th><th class="l">Tipo</th></tr></thead><tbody>${rows}</tbody></table></div>

function renderMethod(M) {
  const I = M.issues;
  const byN = (a, b) => { const x = parseNum(a), y = parseNum(b); return (Number.isNaN(x) || Number.isNaN(y)) ? String(a).localeCompare(String(b)) : x - y; };
  const list = arr => { const s = arr.slice().sort(byN); return s.slice(0, 12).map(n => 'N·' + esc(n)).join(', ') + (s.length > 12 ? '…' : ''); };
  const ops = n => `${n} ${plural(n, 'operación', 'operaciones')}`;
  const items = [];
  const dup = M.rawCount - M.uniqueCount;
  if (dup > 0) items.push(`${dup} ${plural(dup, 'fila repetida', 'filas repetidas')} en la fuente (ediciones sucesivas de la misma operación): se usa la última versión de cada N·.`);
  if (I.dayMismatch.length) items.push(`${ops(I.dayMismatch.length)} con "Día Entrada" distinto del día de la semana de su fecha (${list(I.dayMismatch)}). El mapa de calor usa "Día Entrada"; meses y semanas usan la fecha. Conviene revisarlas en Notion.`);
  if (I.assumed.length) items.push(`${ops(I.assumed.length)} con resultado pero sin RR final (${list(I.assumed)}): se ha asumido ±1R.`);
  if (I.inconsistent.length) items.push(`${ops(I.inconsistent.length)} con un RR final que contradice el resultado (${list(I.inconsistent)}): se usa el RR final.`);
  if (I.noRisk.length) items.push(`${ops(I.noRisk.length)} sin un riesgo válido en la columna Riesgo (${list(I.noRisk)}): se ha asumido ${fmtRisk(CFG.DEFAULT_RISK_PCT)}.`);
  if (I.noDate.length) items.push(`${ops(I.noDate.length)} sin fecha válida (${list(I.noDate)}): cuentan en los totales, pero no en meses ni semanas.`);
  if (I.otherRes.length) items.push(`${ops(I.otherRes.length)} con un resultado no reconocido y sin RR (${list(I.otherRes)}): ${plural(I.otherRes.length, 'excluida', 'excluidas')} de los cálculos.`);
  return `${sec('08', 'Metodología')}
  <details class="panel"><summary><span class="panel-t">Cómo se calcula cada métrica${items.length ? ` · ${items.length} ${plural(items.length, 'aviso', 'avisos')} de datos` : ''}</span>${ICON_CHEV}</summary>
    <div class="method">
      <dl>
        <dt>Riesgo y beneficio</dt><dd>Cada operación usa su propio riesgo (columna Riesgo, en % del capital inicial de ${fmtEur(CFG.CAPITAL)}), sin interés compuesto. Beneficio = RR final × riesgo × ${fmtEur(CFG.CAPITAL)}. Si una fila no tiene un riesgo válido (entre ${fmtRisk(CFG.RISK_MIN)} y ${fmtRisk(CFG.RISK_MAX)}) se asume ${fmtRisk(CFG.DEFAULT_RISK_PCT)} y se avisa abajo.</dd>
        <dt>Win Rate y break-even</dt><dd>Ganadoras / operaciones cerradas (los BE cuentan en el total). Break-even = pérdida media / (ganancia media + pérdida media), en €, ajustado por la proporción de BE: el win rate mínimo para no perder dinero con tus ganancias y pérdidas medias reales.</dd>
        <dt>Profit Factor y Esperanza</dt><dd>Profit factor = beneficio bruto / pérdida bruta, en €. Esperanza = beneficio medio por operación en €; el RR medio es la media del RR final (resultado medido en múltiplos del riesgo de cada operación, independiente de cuánto arriesgaste).</dd>
        <dt>Drawdown</dt><dd>Mayor caída del capital desde un máximo previo hasta el mínimo posterior, medida al cierre de cada operación (no incluye pérdidas flotantes).</dd>
        <dt>Rentabilidad mensual</dt><dd>Beneficio del mes / capital al inicio del mes (TWR). Se incluyen los meses sin operar (0%). Las estadísticas mensuales usan solo meses cerrados.</dd>
        <dt>Sharpe y Sortino</dt><dd>Sharpe = media mensual / desviación típica muestral × √12 (tipo libre de riesgo 0%). Sortino = media mensual / desviación a la baja × √12, con la desviación a la baja calculada sobre todos los meses (objetivo 0%). Se marcan como muestra corta hasta tener 12 meses cerrados.</dd>
        <dt>Rentabilidad anualizada y Calmar</dt><dd>Solo con 12 meses o más de historial: las rentabilidades de periodos inferiores a un año no se anualizan (norma GIPS). CAGR = (capital final / inicial)<sup>365,25 / días</sup> − 1. Calmar = CAGR / Max Drawdown.</dd>
        <dt>Monte Carlo</dt><dd>${fmtNum(CFG.MC_PATHS, 0)} simulaciones de las próximas operaciones (≈ 12 meses al ritmo actual) remuestreando tus propios resultados en € (cada uno con el riesgo que usaste) con pesos aleatorios (bootstrap bayesiano), lo que incorpora la incertidumbre del win rate por tener una muestra pequeña. El drawdown se mide desde el máximo de capital (incluido el drawdown actual, si lo hay). Supone operaciones independientes y la misma mezcla de riesgos que hasta ahora; es una estimación, no una garantía.</dd>
        <dt>Colores</dt><dd>Win rate: según la esperanza en R (RR medio): verde ≥ +${fmtNum(CFG.EDGE_GOOD_R, 1)}R, ámbar entre 0 y +${fmtNum(CFG.EDGE_GOOD_R, 1)}R, rojo negativa; en un sistema 1:1 equivale a win rate ≥ 60%, 50–60% y &lt; 50%. Profit factor: verde ≥ 1,5, ámbar entre 1 y 1,5, rojo &lt; 1.</dd>
        <dt>Asignación temporal</dt><dd>Las operaciones se ordenan y se asignan a meses y semanas por su fecha de entrada. La semana operativa empieza el domingo con la apertura del mercado.</dd>
      </dl>
      <h4>Control de datos</h4>
      ${items.length ? `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>` : '<p>Sin incidencias en los datos.</p>'}
    </div>
  </details>`;
}

  requestAnimationFrame(() => drawCharts(M));
}

/* ── Gráficos ── */
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function theme() {
  const t = {};
  ['--panel', '--border', '--border2', '--grid', '--text', '--text2', '--muted', '--accent', '--good', '--bad', '--warn', '--bar', '--accent-rgb', '--bad-rgb', '--good-rgb'].forEach(k => t[k.slice(2).replace(/-(\w)/g, (_, c) => c.toUpperCase())] = cssVar(k));
  return t;
}
function destroyCharts() { charts.forEach(c => { try { c.destroy(); } catch (e) { /* ya destruido */ } }); charts = []; }

const pluginXMarkers = {
  id: 'xMarkers',
  beforeDatasetsDraw(chart, _a, o) {
    if (!o || !o.at || !o.at.length) return;
    const { ctx, chartArea: { top, bottom }, scales: { x } } = chart;
    ctx.save(); ctx.strokeStyle = o.color; ctx.lineWidth = 1;
    o.at.forEach(i => { const px = Math.round((x.getPixelForValue(i - 1) + x.getPixelForValue(i)) / 2) + 0.5; ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px, bottom); ctx.stroke(); });
    ctx.restore();
  }
};
const pluginHLines = {
  id: 'hLines',
  beforeDatasetsDraw(chart, _a, o) {
    if (!o || !o.lines || !o.lines.length) return;
    const { ctx, chartArea: { left, right, top, bottom }, scales: { y } } = chart;
    ctx.save();
    o.lines.forEach(l => {
      const py = Math.round(y.getPixelForValue(l.y)) + 0.5;
      if (py < top - 1 || py > bottom + 1) return;
      ctx.strokeStyle = l.color; ctx.lineWidth = l.width || 1.25; ctx.setLineDash(l.dash || []);
      ctx.beginPath(); ctx.moveTo(left, py); ctx.lineTo(right, py); ctx.stroke();
    });
    ctx.restore();
  }
};
const pluginCrosshair = {
  id: 'crosshair',
  afterDatasetsDraw(chart, _a, o) {
    if (!o || !o.color) return;
    const act = chart.tooltip && chart.tooltip.getActiveElements ? chart.tooltip.getActiveElements() : [];
    if (!act.length) return;
    const { ctx, chartArea: { top, bottom } } = chart;
    const px = Math.round(act[0].element.x) + 0.5;
    ctx.save(); ctx.strokeStyle = o.color; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px, bottom); ctx.stroke(); ctx.restore();
  }
};
if (window.Chart) Chart.register(pluginXMarkers, pluginHLines, pluginCrosshair);

// Etiquetas del eje X: el mes en la primera operación de cada mes, sin solaparse
function monthTicks(dayList, offset, canvas) {
  const labels = new Array(dayList.length + offset).fill('');
  const breaks = [];
  const w = (canvas && canvas.parentElement && canvas.parentElement.clientWidth) || 800;
  const total = dayList.length + offset;
  const minGap = Math.max(1, Math.ceil(34 / Math.max(1, w / Math.max(1, total))));
  let prevMonth = null, lastLabeled = -1e9;
  dayList.forEach((d, i) => {
    if (d == null) return;
    const mi = monthIdx(d);
    if (mi !== prevMonth) {
      const idx = i + offset;
      if (prevMonth != null) breaks.push(idx);
      if (idx - lastLabeled >= minGap) { labels[idx] = MES[mi % 12]; lastLabeled = idx; }
      prevMonth = mi;
    }
  });
  return { labels, breaks };
}

function baseOptions(t, labels, yFmt) {
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: 'index', intersect: false },
    layout: { padding: { top: 4, right: 4 } },
    plugins: {
      legend: { display: false },
      crosshair: { color: t.border2 },
      tooltip: {
        backgroundColor: t.panel, borderColor: t.border2, borderWidth: 1, titleColor: t.text, bodyColor: t.text2,
        titleFont: { family: 'Inter', weight: '600', size: 12 }, bodyFont: { family: 'Inter', size: 12 },
        padding: 10, cornerRadius: 8, displayColors: false, caretSize: 5
      }
    },
    scales: {
      x: { grid: { display: false }, border: { color: t.border2 }, ticks: { color: t.muted, autoSkip: false, maxRotation: 0, font: { family: 'Inter', size: 11 }, callback: (_v, i) => labels[i] || '' } },
      y: { grid: { color: t.grid }, border: { display: false }, ticks: { color: t.muted, font: { family: 'Inter', size: 11 }, maxTicksLimit: 6, callback: yFmt } }
    }
  };
}

function drawCharts(M) {
  if (!window.Chart) return;
  const t = theme();
  const tr = M.trades;
  const tradeTitle = i => { const x = tr[i]; return `Operación ${i + 1} · ${fmtDate(x.day)}`; };

  // 1) Capital en €
  const eqC = $('eqChart');
  if (eqC && tr.length) {
    const { labels, breaks } = monthTicks(tr.map(x => x.day), 1, eqC);
    const data = [CFG.CAPITAL, ...tr.map(x => x.eq)];
    // Decimales según el paso entre marcas (evita etiquetas repetidas tipo "101k" / "101k")
    const opt = baseOptions(t, labels, (v, _i, ticks) => {
      const step = ticks && ticks.length > 1 ? Math.abs(ticks[1].value - ticks[0].value) : 1000;
      return fmtNum(v / 1000, step >= 1000 ? 0 : step >= 100 ? 1 : 2) + 'k €';
    });
    opt.plugins.xMarkers = { at: breaks, color: t.grid };
    opt.plugins.hLines = { lines: [{ y: CFG.CAPITAL, color: t.muted, dash: [4, 4], width: 1 }] };
    opt.plugins.tooltip.callbacks = {
      title: it => it[0].dataIndex === 0 ? 'Capital inicial' : tradeTitle(it[0].dataIndex - 1),
      label: it => {
        if (it.dataIndex === 0) return `Capital: ${fmtEur(CFG.CAPITAL)}`;
        const x = tr[it.dataIndex - 1];
        return [`Capital: ${fmtEur(x.eq)}`, `${outLabel(x.out)} ${fmtR(x.R, 1)} al ${fmtRisk(x.risk)} de riesgo (${fmtEur(x.pnl, true)})`, `${x.par}${x.dir ? ' · ' + x.dir : ''} · N·${x.nraw}`];
      }
    };
    charts.push(new Chart(eqC, {
      type: 'line',
      data: { labels, datasets: [{
        data, borderColor: t.accent, borderWidth: 2, cubicInterpolationMode: 'monotone', tension: 0.4,
        pointRadius: 0, pointHoverRadius: 4.5, pointHoverBackgroundColor: t.accent, pointHoverBorderColor: t.panel, pointHoverBorderWidth: 2,
        fill: { target: { value: CFG.CAPITAL }, above: `rgba(${t.accentRgb},0.10)`, below: `rgba(${t.badRgb},0.12)` }
      }] },
      options: opt
    }));
  }

  // 2) Drawdown
  const ddC = $('ddChart');
  if (ddC && tr.length) {
    const { labels, breaks } = monthTicks(tr.map(x => x.day), 1, ddC);
    const data = [0, ...tr.map(x => -x.dd * 100)];
    const minV = Math.min(...data);
    const opt = baseOptions(t, labels, v => fmtNum(v, 0) + '%');
    opt.scales.y.max = 0;
    opt.scales.y.suggestedMin = Math.min(-1, minV * 1.15);
    opt.plugins.xMarkers = { at: breaks, color: t.grid };
    opt.plugins.tooltip.callbacks = {
      title: it => it[0].dataIndex === 0 ? 'Capital inicial' : tradeTitle(it[0].dataIndex - 1),
      label: it => {
        if (it.dataIndex === 0) return 'Drawdown: 0,00%';
        const x = tr[it.dataIndex - 1];
        return x.dd > EPS ? [`Drawdown: ${fmtPct(-x.dd, 2)} (${fmtEur(x.eq - x.peak, true)})`, `Máximo previo: ${fmtEur(x.peak)}`] : ['En máximos de capital', `Capital: ${fmtEur(x.eq)}`];
      }
    };
    charts.push(new Chart(ddC, {
      type: 'line',
      data: { labels, datasets: [{ data, borderColor: t.bad, borderWidth: 1.5, tension: 0, pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: t.bad, pointHoverBorderColor: t.panel, pointHoverBorderWidth: 2, fill: { target: 'origin', below: `rgba(${t.badRgb},0.14)` } }] },
      options: opt
    }));
  }

  // 3) Frecuencia semanal
  const fC = $('freqChart');
  if (fC && M.weeks.length) {
    const wk = M.weeks;
    const labels = new Array(wk.length).fill('');
    let prev = null, lastL = -1e9;
    const w = fC.parentElement.clientWidth || 800;
    const minGap = Math.max(1, Math.ceil(34 / Math.max(1, w / wk.length)));
    wk.forEach((x, i) => { const mi = monthIdx(x.ws); if (mi !== prev) { if (i - lastL >= minGap) { labels[i] = MES[mi % 12]; lastL = i; } prev = mi; } });
    const opt = baseOptions(t, labels, v => Number.isInteger(v) ? String(v) : '');
    opt.scales.y.beginAtZero = true;
    opt.scales.y.ticks.precision = 0;
    opt.plugins.crosshair = { color: null };
    opt.plugins.hLines = { lines: [{ y: M.totals.opsWeek, color: t.text2, dash: [4, 4], width: 1.25 }] };
    opt.plugins.tooltip.callbacks = {
      title: it => `Semana del ${fmtDate(wk[it[0].dataIndex].ws)}`,
      label: it => it.datasetIndex === 0 ? `${wk[it.dataIndex].count} ${plural(wk[it.dataIndex].count, 'operación', 'operaciones')}` : (it.raw == null ? null : `Media móvil 4 sem.: ${fmtNum(it.raw, 1)}`)
    };
    opt.plugins.tooltip.filter = it => it.raw != null;
    opt.plugins.tooltip.itemSort = (a, b) => a.datasetIndex - b.datasetIndex;
    charts.push(new Chart(fC, {
      data: { labels, datasets: [
        { type: 'bar', data: wk.map(x => x.count), backgroundColor: t.bar, borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: 'bottom', maxBarThickness: 18, categoryPercentage: 0.8, barPercentage: 0.9, order: 2 },
        { type: 'line', data: wk.map(x => x.ma), borderColor: t.accent, borderWidth: 2, pointRadius: 0, pointHoverRadius: 0, cubicInterpolationMode: 'monotone', spanGaps: false, order: 1 }
      ] },
      options: opt
    }));
  }

  // 4) Win rate móvil
  const rC = $('rollChart');
  if (rC) {
    const idx = [], vals = [], days = [];
    M.rolling.forEach((v, i) => { if (v != null) { idx.push(i); vals.push(v * 100); days.push(tr[i].day); } });
    const { labels, breaks } = monthTicks(days, 0, rC);
    const opt = baseOptions(t, labels, v => v + '%');
    opt.scales.y.min = 0; opt.scales.y.max = 100;
    opt.scales.y.ticks.stepSize = 25;
    opt.plugins.xMarkers = { at: breaks, color: t.grid };
    const lines = [{ y: M.totals.wr * 100, color: t.text2, dash: [4, 4], width: 1.25 }];
    if (M.totals.beWr != null) lines.push({ y: M.totals.beWr * 100, color: t.bad, dash: [4, 4], width: 1.25 });
    opt.plugins.hLines = { lines };
    opt.plugins.tooltip.callbacks = {
      title: it => tradeTitle(idx[it[0].dataIndex]),
      label: it => [`Win rate últimas ${CFG.ROLL_WIN}: ${fmtNum(it.raw, 0)}%`, `Global: ${fmtPct(M.totals.wr, 1, false)}`]
    };
    charts.push(new Chart(rC, {
      type: 'line',
      data: { labels, datasets: [{ data: vals, borderColor: t.accent, borderWidth: 2, cubicInterpolationMode: 'monotone', pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: t.accent, pointHoverBorderColor: t.panel, pointHoverBorderWidth: 2 }] },
      options: opt
    }));
  }
}
