function withTimeout(promise, ms) {
  return new Promise((resolve, reject) => {
    const id = setTimeout(() => reject(new Error('tiempo de espera agotado')), ms);
    promise.then(v => { clearTimeout(id); resolve(v); }, e => { clearTimeout(id); reject(e); });
  });
}
async function fetchWithFallback(url) {
  const routes = [
    u => u + (u.includes('?') ? '&' : '?') + 't=' + Date.now(),
    u => 'https://corsproxy.io/?' + encodeURIComponent(u),
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)
  ];
  let last = '';
  for (const build of routes) {
    try {
      const res = await withTimeout(fetch(build(url), { cache: 'no-store' }), 12000);
      if (!res.ok) { last = 'HTTP ' + res.status; continue; }
      const text = await res.text();
      if (text.trim().startsWith('<')) { last = 'respuesta no válida'; continue; }
      if (text.trim().length < 10) { last = 'respuesta vacía'; continue; }
      return text;
    } catch (e) { last = e.message; }
  }
  throw new Error('no se pudo cargar la fuente de datos (' + last + ')');
}

function normalizeUrl(url) {
  url = url.trim();
  if (url.includes('docs.google.com/spreadsheets') && !url.includes('pub?') && !url.includes('export')) {
    const m = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
    const g = url.match(/[#&?]gid=(\d+)/);
    if (m) url = `https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv&gid=${g ? g[1] : '0'}`;
  }
  return url.replace(/[&?]t=\d+/g, '');
}

async function loadData(url, { fromSetup = false } = {}) {
  const first = !MODEL;
  if (first) $('loading').classList.remove('hidden'); else $('content').classList.add('dim');
  const btn = $('refreshBtn');
  btn.disabled = true; btn.classList.add('busy');
  try {
    const text = await fetchWithFallback(url);
    const parsed = Papa.parse(text, { skipEmptyLines: 'greedy' });
    if (!parsed.data || parsed.data.length < 2) throw new Error('la fuente de datos está vacía');
    const model = buildModel(parsed.data, todayDay());
    if (!model.uniqueCount) throw new Error('no se encontró la columna N· o no hay operaciones');
    currentUrl = url; store(CSV_KEY, url);
    loadedAt = new Date();
    MODEL = model;
    $('dash').classList.remove('hidden');
    renderAll(model);
    if (fromSetup) closeSetup();
  } catch (e) {
    const msg = 'Error: ' + e.message + '.';
    if (fromSetup) $('setupErr').textContent = msg + ' Revisa que la dirección sea correcta y pública.';
    else if (MODEL) { const b = $('banner'); if (b) b.innerHTML = `<div class="banner">No se pudieron actualizar los datos: ${esc(e.message)}. Se muestran los últimos datos cargados.</div>`; }
    else showFatal(e.message);
  } finally {
    $('loading').classList.add('hidden');
    $('content').classList.remove('dim');
    btn.disabled = false; btn.classList.remove('busy');
  }
}
function showFatal(msg) {
  $('dash').classList.remove('hidden');
  $('content').innerHTML = `<div class="panel" style="margin-top:24px"><div class="panel-b"><div class="panel-t" style="margin-bottom:6px">No se pudieron cargar los datos</div><p class="c-muted" style="margin-bottom:14px">${esc(msg.charAt(0).toUpperCase() + msg.slice(1))}. Revisa tu conexión y vuelve a intentarlo.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="loadData(currentUrl)">Reintentar</button><button class="btn" onclick="showSetup()">Fuente de datos</button></div></div></div>`;
}

/* ── Configuración, tema y acceso ── */
function showSetup() { $('csvUrl').value = currentUrl; $('setupErr').textContent = ''; $('setup').classList.remove('hidden'); }
function closeSetup() { $('setup').classList.add('hidden'); }
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
function applyTheme(th) {
  document.documentElement.setAttribute('data-theme', th);
  store(THEME_KEY, th);
  $('themeBtn').innerHTML = th === 'dark' ? ICON_SUN : ICON_MOON;
  if (MODEL) renderAll(MODEL);
}
function unlock() { $('gate').classList.add('hidden'); loadData(currentUrl); }
function checkPw() {
  const inp = $('pwInput');
  if (inp.value === CORRECT_PW) { store(PW_KEY, '1'); unlock(); }
  else { $('pwErr').textContent = 'Contraseña incorrecta'; inp.value = ''; inp.focus(); setTimeout(() => { $('pwErr').textContent = ''; }, 2500); }
}

window.addEventListener('DOMContentLoaded', () => {
  $('themeBtn').innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? ICON_SUN : ICON_MOON;
  $('themeBtn').addEventListener('click', () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
  $('refreshBtn').addEventListener('click', () => loadData(currentUrl));
  $('setupBtn').addEventListener('click', showSetup);
  $('setupClose').addEventListener('click', closeSetup);
  $('setup').addEventListener('click', e => { if (e.target.id === 'setup') closeSetup(); });
  $('setupSave').addEventListener('click', () => { const u = $('csvUrl').value; if (u.trim()) loadData(normalizeUrl(u), { fromSetup: true }); });
  $('setupReset').addEventListener('click', () => { $('csvUrl').value = DEFAULT_URL; });
  $('pwBtn').addEventListener('click', checkPw);
  $('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSetup(); });
  if (store(PW_KEY) === '1') unlock(); else setTimeout(() => $('pwInput').focus(), 50);
});
</script>
